schemaVersion: 2.2.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: devspaces-sshd-sandbox
components:
- name: dev-tools
  container: 
    image: quay.io/cgruver0/che/sshd-workspace-base:userns    
    memoryLimit: 16Gi
    memoryRequest: 2Gi
    cpuLimit: "4"
    cpuRequest: 100m
    env:
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "/projects/devspaces-sshd-sandbox/vscode.code-workspace"
    - name: FIGHTS_SERVICE_PORT
      value: "8080"
    endpoints:
    - name: https-ui
      targetPort: 8080
      exposure: public
      protocol: https
    - name: https-heroes
      targetPort: 8083
      exposure: public
      protocol: https
    - name: https-villains
      targetPort: 8084
      exposure: public
      protocol: https
    - name: https-fights
      targetPort: 8082
      exposure: public
      protocol: https
    - name: https-stats
      targetPort: 8085
      exposure: public
      protocol: https
    - name: https-narration
      targetPort: 8087
      exposure: public
      protocol: https
    - name: https-locations
      targetPort: 8089
      exposure: public
      protocol: https
    - name: debug-ui
      targetPort: 5005
      exposure: internal
    - name: debug-villains
      targetPort: 5006
      exposure: internal
    - name: debug-heroes
      targetPort: 5007
      exposure: internal
    - name: debug-fights
      targetPort: 5008
      exposure: internal
    - name: debug-stats
      targetPort: 5009
      exposure: internal
    - name: node-port
      targetPort: 4200
      exposure: internal
- name: prep-workspace
  container:
    args:
      - '-c'
      - >-
        mkdir -p /projects/bin && cp /usr/bin/oc /projects/bin/oc && cp /usr/bin/kubectl /projects/bin/kubectl && if [[ -f ${HOME}/.kube/config ]]; then rm ${HOME}/.kube/config; fi
    command:
      - /bin/bash
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    mountSources: true
    sourceMapping: /projects
    memoryRequest: 128Mi
    memoryLimit: 256Mi
    cpuRequest: 10m
    cpuLimit: 200m
    env:
    - name: HOME
      value: "/projects/home"
commands:
- apply:
    component: prep-workspace
    label: Pre Start Prep
  id: prep-workspace
events:
  preStart:
    - prep-workspace
